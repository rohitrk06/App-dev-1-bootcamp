{% extends 'index.html' %}

{% block title %}
Edit Category - Grocery Store
{% endblock %}


{% block body %}
<div class="container-fluid mt-5">
    <h1 class="text-center">Add Category</h1>
    <form class="row justify-content-center" action={{url_for('edit_category',id=category.id)}} method = "POST">
        <div class="mb-3 col-7">
          <label for="name" class="form-label">Category Name</label>
          <input type="text" class="form-control" id="name" name = "name" value={{category.name}}>
        </div>
        <div class="mb-3 col-7">
          <label for="description" class="form-label">Category Description</label>
          <!-- <input type="password" class="form-control" id="password" name="password"> -->
           <textarea class="form-control" id="description" name="description" rows="3">{{category.decsription }}</textarea>
        </div>
        <div class="col-7">
            <button  type="submit" class="btn btn-primary">Edit Category</button>
        </div>
      </form>
</div>
{% endblock %}
